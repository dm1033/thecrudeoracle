name: Update Crude Oil Market Data

on:
  schedule:
    # Runs Wednesdays at 15:40 UTC (after EIA 10:30 AM ET Weekly Petroleum Status Report)
    - cron: '40 15 * * 3'
    # Runs Fridays at 20:45 UTC (after CFTC 3:30 PM ET Commitments of Traders release)
    - cron: '45 20 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch EIA & CFTC datasets
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/fetch_oil_data.py

      # Actions cannot open pull requests in this repo. open-data-pr.sh publishes to main when that happens.
      - name: Open a pull request if the snapshot changed
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: "chore(data): automated EIA and CFTC crude update"
          PR_TITLE: "chore(data): automated EIA and CFTC crude update"
          PR_BODY: "Automated EIA and CFTC snapshot. Review the figures before merging. Bots do not push to main."
        run: bash scripts/open-data-pr.sh bot/crude-market-data data/market_snapshot.json
