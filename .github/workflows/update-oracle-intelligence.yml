name: Update public data monitor

# Rebuilds public/data/oracle_intelligence.json from free public sources.
# CFTC, GDELT and FRED need no key (FRED uses its API when FRED_API_KEY is
# set, its public CSV download otherwise). EIA and AGSI+ modules are skipped
# here until their repository secret is set; the site reads EIA directly when
# this file has no EIA data.
on:
  schedule:
    # Morning: EU gas storage and overnight news volume
    - cron: '15 6 * * *'
    # After the EIA Weekly Petroleum Status Report (Wednesdays 10:30 ET)
    - cron: '35 15 * * 3'
    # After the CFTC Commitments of Traders release (Fridays 15:30 ET)
    - cron: '15 20 * * 5'
    # After the US close: daily spot and FRED series
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: oracle-intelligence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch public data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          AGSI_API_KEY: ${{ secrets.AGSI_API_KEY }}
        run: python3 scripts/build_oracle_intelligence.py

      # Actions cannot open pull requests in this repo. open-data-pr.sh publishes to main when that happens.
      - name: Open a pull request if the monitor changed
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: "chore(data): update public data monitor"
          PR_TITLE: "chore(data): update public data monitor"
          PR_BODY: "Automated public-data monitor refresh. Review the figures before merging. Bots do not push to main."
        run: bash scripts/open-data-pr.sh bot/oracle-intelligence public/data/oracle_intelligence.json
