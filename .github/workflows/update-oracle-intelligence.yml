name: Update public data monitor

# Rebuilds public/data/oracle_intelligence.json from free public sources.
# CFTC, GDELT and FRED need no key (FRED uses its API when FRED_API_KEY is
# set, its public CSV download otherwise). EIA and AGSI+ modules are skipped
# here until their repository secret is set; the site reads EIA directly when
# this file has no EIA data.
on:
  schedule:
    # Morning: EU gas storage and overnight news volume
    - cron: '15 6 * * *'
    # After the EIA Weekly Petroleum Status Report (Wednesdays 10:30 ET)
    - cron: '35 15 * * 3'
    # After the CFTC Commitments of Traders release (Fridays 15:30 ET)
    - cron: '15 20 * * 5'
    # After the US close: daily spot and FRED series
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oracle-intelligence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # TEMPORARY, branch only: report which monitor cards are loaded on the live site.
      - name: Check the live page
        continue-on-error: true
        run: |
          curl -sS -m 40 -A "public-data-monitor-check/1.0" -o live.html -w "HTTP %{http_code}\n" https://www.thecrudeoracle.com/tools/public-data-monitor || true
          python3 - <<'PY'
          import re, html
          s = open("live.html", encoding="utf-8", errors="replace").read()
          print("bytes", len(s))
          ids = ["pdm-prices", "pdm-inventories", "pdm-positioning", "pdm-trend", "pdm-macro", "pdm-gas", "pdm-news"]
          pos = sorted((s.find(f'id="{i}"'), i) for i in ids)
          for n, (at, i) in enumerate(pos):
              if at < 0:
                  print("LIVE", i, "MISSING"); continue
              end = pos[n + 1][0] if n + 1 < len(pos) else at + 6000
              text = re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", s[at:end])))
              print("LIVE", i, "|", "NOT LOADED" if "Not loaded" in text else "loaded", "|", text[text.find(">") + 1:][:520])
          PY

      - name: Fetch public data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          AGSI_API_KEY: ${{ secrets.AGSI_API_KEY }}
        run: python3 scripts/build_oracle_intelligence.py

      # No [skip ci]: the site imports this file at build time, so the push
      # must trigger a deploy. The script only rewrites the file when a
      # module's data changed, so quiet runs commit nothing.
      - name: Commit the file if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/oracle_intelligence.json
          git diff --staged --quiet && exit 0
          git commit -m "chore(data): update public data monitor"
          git pull --rebase --quiet
          git push
