# Netlify configuration for The Crude Oracle (alternative to Vercel).
# The official Next.js runtime plugin is applied automatically for Next.js
# projects on Netlify; this file pins the build settings.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Netlify-only. Vercel does not read this file, so the production host is unchanged.
# force is required so generated Next.js routes do not win over the redirect.
[[redirects]]
  from = "/"
  to = "https://www.thecrudeoracle.com/"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "https://www.thecrudeoracle.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
